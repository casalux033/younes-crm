<style>

<body>
<section id="login">
 <div class="login-card">
  <div class="brand"><span>Y</span> YOUNES CRM</div>

   <button data-page="dashboard" class="active"><span class="ico">▦</span><span data-i18n="dashboard">Dashboard</span></button>
   <button data-page="contacts"><span class="ico">♙</span><span data-i18n="contacts">Contacts</span></button>
   <button data-page="companies"><span class="ico">▤</span><span data-i18n="companies">Entreprises</span></button>

   <button data-page="deals"><span class="ico">◇</span><span data-i18n="deals">Opportunités</span></button>

   <button data-page="notes"><span class="ico">▧</span><span data-i18n="notes">Notes</span></button>
   <button data-page="orders"><span class="ico">🧾</span><span data-i18n="orders">Commandes HERMANO</span></button>

 </aside>
 <main class="main">

  <section class="content" id="content"></section>

</div>
<div id="modalRoot"></div>
<script>
window.__crmModuleReady=false;
window.addEventListener('error',function(e){
 const box=document.getElementById('loginMsg');
 if(box){box.textContent='Erreur de chargement CRM : '+(e.message||'JavaScript');box.classList.remove('hidden');box.classList.add('error');}
});
window.addEventListener('unhandledrejection',function(e){
 const box=document.getElementById('loginMsg');
 if(box){box.textContent='Erreur CRM : '+(e.reason?.message||String(e.reason||'chargement'));box.classList.remove('hidden');box.classList.add('error');}
});
document.getElementById('loginForm').addEventListener('submit',function(e){
 if(!window.__crmModuleReady){
  e.preventDefault();
  const box=document.getElementById('loginMsg');
  box.textContent='Le système CRM ne s’est pas chargé. Vérifiez la connexion Internet puis actualisez la page (Ctrl + Shift + R).';
  box.classList.remove('hidden');box.classList.add('error');
 }
},true);
</script>

 area.querySelectorAll('[data-order-status]').forEach(el=>el.onchange=async()=>{

 });

let barberTab='appointments', barberTenantId=null, barberCache={barbers:[],services:[],appointments:[]};
async function getBarberTenant(){
 if(barberTenantId)return barberTenantId;
 const {data,error}=await sb.from('crm_tenants').select('id').eq('slug','ms-house-barber').single();
 if(error)throw error;barberTenantId=data.id;return barberTenantId;
}
async function renderBarberPage(){
 const c=document.getElementById('content');
 document.getElementById('topTitle').textContent='MS HOUSE BARBER';
 c.innerHTML=`<div class="page-head"><div><h1>MS HOUSE BARBER</h1><div class="muted">Gestion du salon · Barbiers · Services · Rendez-vous</div></div><a class="btn secondary" href="./booking.html" target="_blank" rel="noopener">Page de réservation ↗</a></div>
 <div class="stats" id="barberStats"><div class="stat">Chargement…</div></div>
 <div class="panel"><div class="toolbar" style="flex-wrap:wrap">
 <button class="btn ${barberTab==='appointments'?'':'secondary'}" data-btab="appointments">Rendez-vous</button>
 <button class="btn ${barberTab==='barbers'?'':'secondary'}" data-btab="barbers">Barbiers</button>
 <button class="btn ${barberTab==='services'?'':'secondary'}" data-btab="services">Services & tarifs</button>
 <button class="btn" id="barberAdd">＋ Ajouter</button>
 </div><div id="barberArea">Chargement…</div></div>`;
 c.querySelectorAll('[data-btab]').forEach(b=>b.onclick=()=>{barberTab=b.dataset.btab;renderBarberPage()});
 document.getElementById('barberAdd').onclick=()=>openBarberForm();
 try{
  const tenant=await getBarberTenant();
  const [bs,ss,as]=await Promise.all([
   sb.from('crm_barbers').select('*').eq('tenant_id',tenant).order('created_at',{ascending:false}),
   sb.from('crm_barber_services').select('*').eq('tenant_id',tenant).order('created_at',{ascending:false}),
   sb.from('crm_barber_appointments').select('*').eq('tenant_id',tenant).order('starts_at',{ascending:false}).limit(200)
  ]);
  for(const r of [bs,ss,as])if(r.error)throw r.error;
  barberCache={barbers:bs.data||[],services:ss.data||[],appointments:as.data||[]};
  const today=new Date();today.setHours(0,0,0,0);const next=new Date(today);next.setDate(next.getDate()+1);
  const todayAp=barberCache.appointments.filter(x=>new Date(x.starts_at)>=today&&new Date(x.starts_at)<next);
  const income=barberCache.appointments.filter(x=>x.payment_status==='paid').reduce((n,x)=>n+Number(x.price||0),0);
  document.getElementById('barberStats').innerHTML=[
   ['Rendez-vous aujourd’hui',todayAp.length],['Barbiers actifs',barberCache.barbers.filter(x=>x.is_active).length],
   ['Services actifs',barberCache.services.filter(x=>x.is_active).length],['Encaissements enregistrés',income.toFixed(2)+' DH']
  ].map(([a,b])=>`<div class="stat"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');
  drawBarberTab();
 }catch(e){document.getElementById('barberArea').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
function drawBarberTab(){
 const area=document.getElementById('barberArea');if(!area)return;
 if(barberTab==='barbers'){
  area.innerHTML=barberCache.barbers.length?`<div class="table-wrap"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Spécialité</th><th>Statut</th></tr></thead><tbody>${barberCache.barbers.map(b=>`<tr><td><b>${esc(b.full_name)}</b></td><td>${esc(b.phone||'—')}</td><td>${esc(b.specialty||'—')}</td><td>${b.is_active?'Actif':'Inactif'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun barbier. Ajoutez votre équipe.</div>';
 }else if(barberTab==='services'){
  area.innerHTML=barberCache.services.length?`<div class="table-wrap"><table><thead><tr><th>Service</th><th>Durée</th><th>Prix</th><th>Part barbier fixe</th><th>Part salon</th><th>Statut</th></tr></thead><tbody>${barberCache.services.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.duration_minutes} min</td><td>${Number(s.price).toFixed(2)} DH</td><td>${Number(s.barber_fixed_fee).toFixed(2)} DH</td><td>${(Number(s.price)-Number(s.barber_fixed_fee)).toFixed(2)} DH</td><td>${s.is_active?'Actif':'Inactif'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun service. Ajoutez vos prestations et tarifs.</div>';
 }else{
  const barberMap=Object.fromEntries(barberCache.barbers.map(x=>[x.id,x.full_name])),serviceMap=Object.fromEntries(barberCache.services.map(x=>[x.id,x.name]));
  area.innerHTML=barberCache.appointments.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Téléphone</th><th>Service</th><th>Barbier</th><th>Total</th><th>Barbier</th><th>Statut</th><th>Paiement</th></tr></thead><tbody>${barberCache.appointments.map(a=>`<tr><td>${new Date(a.starts_at).toLocaleString()}</td><td><b>${esc(a.client_name)}</b></td><td>${esc(a.client_phone)}</td><td>${esc(serviceMap[a.service_id]||'—')}</td><td>${esc(barberMap[a.barber_id]||'—')}</td><td>${Number(a.price).toFixed(2)} DH</td><td>${Number(a.barber_fixed_fee).toFixed(2)} DH</td><td><select data-astatus="${a.id}">${['pending','confirmed','in_progress','completed','cancelled','no_show'].map(v=>`<option value="${v}" ${a.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn ${a.payment_status==='paid'?'secondary':''} small" data-paid="${a.id}">${a.payment_status==='paid'?'Payé au barbier':'Marquer payé'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun rendez-vous pour le moment.</div>';
  area.querySelectorAll('[data-astatus]').forEach(el=>el.onchange=async()=>{const {error}=await sb.from('crm_barber_appointments').update({status:el.value}).eq('id',el.dataset.astatus);if(error)alert(error.message);else renderBarberPage()});
  area.querySelectorAll('[data-paid]').forEach(el=>el.onclick=async()=>{const {error}=await sb.from('crm_barber_appointments').update({payment_status:'paid',paid_to_barber:true,payment_method:'cash'}).eq('id',el.dataset.paid);if(error)alert(error.message);else renderBarberPage()});
 }
}
async function openBarberForm(){
 const type=barberTab,tenant=await getBarberTenant();
 let fields='';
 if(type==='barbers')fields=`<div class="field"><label>Nom complet</label><input name="full_name" required></div><div class="field"><label>Téléphone</label><input name="phone"></div><div class="field"><label>Spécialité</label><input name="specialty" placeholder="Coupe, barbe…"></div>`;
 if(type==='services')fields=`<div class="field"><label>Nom du service</label><input name="name" required></div><div class="field"><label>Durée (minutes)</label><input name="duration_minutes" type="number" min="5" max="240" value="30" required></div><div class="field"><label>Prix client (DH)</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Montant fixe du barbier (DH)</label><input name="barber_fixed_fee" type="number" min="0" step=".01" value="0" required></div><div class="field wide"><label>Description</label><textarea name="description"></textarea></div>`;
 if(type==='appointments')fields=`<div class="field"><label>Nom du client</label><input name="client_name" required></div><div class="field"><label>Téléphone</label><input name="client_phone" required></div><div class="field"><label>Barbier</label><select name="barber_id" required>${barberCache.barbers.filter(x=>x.is_active).map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div><div class="field"><label>Service</label><select name="service_id" required>${barberCache.services.filter(x=>x.is_active).map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.price} DH</option>`).join('')}</select></div><div class="field"><label>Date et heure</label><input name="starts_at" type="datetime-local" required></div><div class="field"><label>Notes</label><input name="notes"></div>`;
 document.getElementById('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Ajouter ${type==='barbers'?'un barbier':type==='services'?'un service':'un rendez-vous'}</h2><button class="btn secondary" id="barberClose">✕</button></div><form id="barberForm"><div class="form-grid">${fields}</div><div id="barberFormMsg" class="notice hidden"></div><div class="actions"><button type="button" class="btn secondary" id="barberCancel">Annuler</button><button class="btn">Enregistrer</button></div></form></div></div>`;
 const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('barberClose').onclick=document.getElementById('barberCancel').onclick=close;
 document.getElementById('barberForm').onsubmit=async e=>{
  e.preventDefault();const fd=new FormData(e.target),p=Object.fromEntries(fd.entries());p.tenant_id=tenant;
  let table=type==='barbers'?'crm_barbers':type==='services'?'crm_barber_services':'crm_barber_appointments';
  if(type==='services'){p.price=Number(p.price);p.barber_fixed_fee=Number(p.barber_fixed_fee);p.duration_minutes=Number(p.duration_minutes);if(p.barber_fixed_fee>p.price){alert('La part fixe du barbier ne peut pas dépasser le prix.');return}}
  if(type==='appointments'){
   const service=barberCache.services.find(x=>x.id===p.service_id);const barber=barberCache.barbers.find(x=>x.id===p.barber_id);
   if(!service||!barber){alert('Ajoutez d’abord un barbier et un service.');return}
   const start=new Date(p.starts_at);const end=new Date(start.getTime()+Number(service.duration_minutes)*60000);
   p.starts_at=start.toISOString();p.ends_at=end.toISOString();p.price=Number(service.price);p.barber_fixed_fee=Number(service.barber_fixed_fee);
   const collision=barberCache.appointments.some(a=>a.barber_id===p.barber_id&&!['cancelled','no_show'].includes(a.status)&&new Date(a.starts_at)<end&&new Date(a.ends_at)>start);
   if(collision){alert('Ce barbier a déjà un rendez-vous pendant cette période.');return}
  }
  const {error}=await sb.from(table).insert(p);if(error){const m=document.getElementById('barberFormMsg');msg(m,error.message,true);return}
  close();await renderBarberPage();
 };
}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusPill(v){const good=['won','done','customer'];const warn=['in_progress','proposal','negotiation','prospect'];return `<span class="pill ${good.includes(v)?'good':warn.includes(v)?'warn':''}">${tr(v||'—')}</span>`}
function drawTable(key,rows){const cfg=tables[key],area=document.getElementById('tableArea');if(!rows.length){area.innerHTML=`<div class="empty">${tr('noData')}</div>`;return}
 const columns=key==='contacts'?[['first_name','firstName'],['last_name','lastName'],['email','email'],['phone','phone'],['status','status']]:key==='companies'?[['name','name'],['industry','industry'],['phone','phone'],['city','city']]:key==='deals'?[['title','title'],['amount','amount'],['stage','stage'],['expected_close_date','expectedClose']]:key==='tasks'?[['title','title'],['status','status'],['priority','priority'],['due_at','due']]:[['body','body'],['created_at','due']];
 area.innerHTML=`<table><thead><tr>${columns.map(x=>`<th>${tr(x[1])}</th>`).join('')}<th>${tr('actions')}</th></tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(([f])=>`<td>${['status','stage','priority'].includes(f)?statusPill(r[f]):esc(f==='amount'&&r[f]!=null?`${r[f]} MAD`:r[f]||'—')}</td>`).join('')}<td><button class="btn secondary small" data-edit="${r.id}">${tr('edit')}</button> <button class="btn danger small" data-del="${r.id}">${tr('delete')}</button></td></tr>`).join('')}</tbody></table>`;
 area.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(key,rows.find(x=>x.id===b.dataset.edit)));area.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRow(key,b.dataset.del));
}
async function openForm(key,row=null){const cfg=tables[key];let html=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>${row?tr('edit'):tr('add')} · ${tr(cfg.title)}</h2><button class="btn secondary" id="closeModal">✕</button></div><form id="recordForm"><div class="form-grid">`;
 for(const [field,label,type='text',opts] of cfg.fields){let value=row?.[field]??(field==='currency'?'MAD':'');html+=`<div class="field ${type==='textarea'?'wide':''}"><label>${tr(label)}</label>`;
 if(type==='textarea')html+=`<textarea name="${field}" rows="3">${esc(value)}</textarea>`;
 else if(type==='select'&&Array.isArray(opts)){html+=`<select name="${field}"><option value="">—</option>${opts.map(o=>`<option value="${o}" ${value===o?'selected':''}>${tr(o)}</option>`).join('')}</select>`}
 else if(type==='select'&&typeof opts==='string'){let related=opts==='crm_companies'?'companies':opts==='crm_contacts'?'contacts':'deals';let list=cache[related]||await getRows(related);html+=`<select name="${field}"><option value="">—</option>${list.map(o=>`<option value="${o.id}" ${value===o.id?'selected':''}>${esc(o.name||`${o.first_name||''} ${o.last_name||''}`||o.title)}</option>`).join('')}</select>`}
 else html+=`<input name="${field}" type="${type}" value="${esc(value)}">`;
 html+='</div>'}
 html+=`</div><div id="formMsg" class="notice hidden"></div><div class="actions"><button type="button" class="btn secondary" id="cancelForm">${tr('cancel')}</button><button class="btn">${tr('save')}</button></div></form></div></div>`;
 document.getElementById('modalRoot').innerHTML=html;document.getElementById('closeModal').onclick=document.getElementById('cancelForm').onclick=()=>document.getElementById('modalRoot').innerHTML='';
 document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),payload={};for(const [k,v] of fd.entries())payload[k]=v===''?null:v;
 if(key==='companies')payload.owner_id=profile.id;if(key==='contacts')payload.owner_id=profile.id;if(key==='deals')payload.owner_id=profile.id;if(key==='tasks'){payload.created_by=profile.id;if(!row)payload.assigned_to=profile.id}
 if(key==='notes')payload.created_by=profile.id;
 if(key==='deals'&&payload.amount)payload.amount=Number(payload.amount);
 const res=row?await sb.from(cfg.table).update(payload).eq('id',row.id):await sb.from(cfg.table).insert(payload);
 if(res.error){msg(document.getElementById('formMsg'),res.error.message,true);return}document.getElementById('modalRoot').innerHTML='';await renderPage();
                                                          
 };
}

window.__crmModuleReady=true;
